version: "3.8"
name: logistic-system

services:

  postgres:
    image: postgres:15
    container_name: logistic-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 5432
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - logistic
    extra_hosts:
      - "localhost:127.0.0.1"

  redis:
    image: redis:latest
    restart: unless-stopped
    container_name: logistic-redis
    ports:
      - "6379:6379"
    networks:
      - logistic
    extra_hosts:
      - "localhost:127.0.0.1"


networks:
  logistic:
    driver: bridge